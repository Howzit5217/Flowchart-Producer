    <!-- Three ways into one chart: writing the pseudocode, drawing the
         flowchart, or writing the program in a language the page can read
         back into pseudocode (18-from-code.js).  The third is the first
         one with a reader in front of it, so it shares the first one's
         paper, its runner and its Build. -->
    <section class="card" id="modes">
      <div class="tabs">
        <button class="tab on" id="tab-code" data-w="mode_code">__W(mode_code)__</button>
        <button class="tab" id="tab-hand" data-w="mode_hand">__W(mode_hand)__</button>
        <button class="tab" id="tab-lang" data-w="mode_lang">__W(mode_lang)__</button>
      </div>
    </section>

    <!-- What is being worked on, while something is.  A card of its own at
         the top of the panel rather than a part of the pseudocode card: it
         sat under Title and Your name, below the program it was the brief
         for, where it was read last.  Here it is read first.  Drawing by
         hand puts the puzzle down, card and all: puzzles are put right in
         the pseudocode, not drawn. -->
    <section class="card" id="pz-card" hidden>
      <div class="pz-top">
        <strong id="pz-name"></strong>
        <span class="pz-won" id="pz-won" hidden></span>
        <button class="icon small" id="pz-shut" data-w-title="done"
                title="__W(done)__" aria-label="__W(done)__">
          <svg viewBox="0 0 20 20"><path d="M5 5l10 10M15 5L5 15"/></svg>
        </button>
      </div>
      <!-- A brief in two halves, each said under its own heading.  What it
           must do is the question; what it does now is the symptom.  The
           headings are small labels and the brief is in full ink, because
           the brief is the thing to read and the labels only say which
           half you are in. -->
      <h4 class="pz-head" id="pz-job-head" data-w="pz_job">__W(pz_job)__</h4>
      <p class="pz-text" id="pz-said"></p>
      <h4 class="pz-head" id="pz-now-head" data-w="pz_now">__W(pz_now)__</h4>
      <p class="pz-text" id="pz-now"></p>
      <!-- Two ways out of where you are that are not solving it: back to
           the program as it arrived, and back to the list.  Both equal,
           both plain -- the button that matters is Check, below. -->
      <div class="pair-wide pz-ways">
        <button class="btn small" id="pz-reset" data-w="pz_reset">__W(pz_reset)__</button>
        <button class="btn small" id="pz-list" data-w="pz_all">__W(pz_all)__</button>
      </div>
    </section>

    <section class="card" id="hand" hidden>
      <!-- How drawing by hand is worked -- what a click, a drag, a dot and
           each key do -- is behind the i rather than written under the
           shapes: read once, a paragraph there was only in the way of the
           panel it sat on (25-keys.js opens it). -->
      <h2><span data-w="add_shape">__W(add_shape)__</span>
        <button class="icon small" id="hand-info" data-w-title="h_info"
                title="__W(h_info)__" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7.5"/><path d="M10 9.2v4.6"/><circle cx="10" cy="6.4" r="1.05" fill="currentColor" stroke="none"/></svg>
        </button>
      </h2>
      <div class="adders" id="adders"></div>
      <div id="hand-sel"></div>
      <!-- Two things to do with a finished drawing, side by side above the
           one that says whether it works.  Tidy up hands the shapes to the
           same layout the pseudocode side is drawn by; As pseudocode shows
           the writing the drawing amounts to, which is the half of the work
           a drawing on its own never gave you. -->
      <div class="hand-row">
        <button class="btn" id="hand-tidy" data-w="h_tidy"
                data-w-title="h_tidy_tip" title="__W(h_tidy_tip)__">__W(h_tidy)__</button>
        <button class="btn" id="hand-code" data-w="h_write"
                data-w-title="h_write_tip" title="__W(h_write_tip)__">__W(h_write)__</button>
      </div>
      <div class="check-row">
        <button class="btn primary wide" id="check" data-w="check">__W(check)__</button>
      </div>
      <div id="report" role="status" aria-live="polite"></div>
    </section>

    <!-- The program as written in a language.  Build reads it into the
         pseudocode card underneath and draws that, so the two boxes are
         the same program twice.  Title, Your name, Options and Build are
         moved up here while this is the way of working (32-code-side.js):
         there is one of each, and they go with the box being written in. -->
    <section class="card" id="lang-src" hidden>
      <h2><span data-w="lang_head">__W(lang_head)__</span>
        <button class="icon small" id="lang-big" data-w-title="code_big"
                title="__W(code_big)__" aria-label="__W(code_big)__"
                aria-expanded="false">
          <svg viewBox="0 0 20 20"><path d="M8 2.5H2.5v5.5M12 2.5h5.5v5.5M8 17.5H2.5V12M12 17.5h5.5V12"/></svg>
        </button>
      </h2>
      <!-- Filled from the table in 18-code.js: every language the page
           writes out, it reads back in. -->
      <select class="field" id="lang-pick" data-w-title="lang_pick"
              title="__W(lang_pick)__" aria-label="__W(lang_pick)__"></select>
      <!-- A program in several files is a tab for each over the one box
           (32-code-side.js draws them), and the plus adds another. -->
      <div class="lang-files" id="lang-files" role="tablist"></div>
      <div id="lang-home"><textarea id="lang-code" spellcheck="false"
        autocapitalize="off" autocomplete="off"></textarea></div>
      <!-- What Build put right in the code before drawing it, and the list
           of it behind a button (32-code-side.js) -->
      <div id="lang-fixed" hidden></div>
      <div id="lang-note"></div>
      <div id="lang-slot"></div>
    </section>

    <section class="card" id="source">
      <h2><span data-w="pseudocode">__W(pseudocode)__</span>
        <button class="icon small" id="code-big" data-w-title="code_big"
                title="__W(code_big)__" aria-label="__W(code_big)__"
                aria-expanded="false">
          <svg viewBox="0 0 20 20"><path d="M8 2.5H2.5v5.5M12 2.5h5.5v5.5M8 17.5H2.5V12M12 17.5h5.5V12"/></svg>
        </button>
      </h2>
      <div id="code-home"><textarea id="code" spellcheck="false">__CODE__</textarea></div>
      <!-- What a story in the box was read as (parse/story.py): the box
           keeps every word that was written, and this is the pseudocode
           the chart was drawn from, made again on every Build.  Only there
           while what is in the box is a story (33-told.js). -->
      <div id="told" hidden>
        <div class="told-top">
          <span class="told-name" id="told-name" data-w="told_head" data-w-title="told_tip"
                title="__W(told_tip)__">__W(told_head)__</span>
          <button class="btn small" id="told-copy" data-w="r_copy">__W(r_copy)__</button>
        </div>
        <div id="told-home"><textarea id="told-box" readonly spellcheck="false"
          aria-labelledby="told-name"></textarea></div>
      </div>
      <!-- The first minute used to be an empty box and an instruction to
           paste something into it, with nothing anywhere on the page saying
           what this pseudocode looks like -- the keywords are in --help and
           in the README, neither of which is in front of the person looking
           at the box.  Three short programs are, and they are gone the
           moment there is anything in the box to be in the way of. -->
      <div id="starts"><div class="starts-in"></div></div>
      <div class="fields">
        <div><label for="f-title" data-w="title">__W(title)__</label>
          <input type="text" id="f-title" value="__T__"></div>
        <div><label for="f-author" data-w="your_name">__W(your_name)__</label>
          <input type="text" id="f-author" value="__A__"></div>
      </div>
      <!-- And the small choices that are not worth a box each live behind
           Options, beside the button they shape.  A setting given its own
           labelled row in the panel costs the same room as Title however
           small it is, and there is a queue of them.  Under here they cost
           a button, and the button says when one of them has been moved
           off what it started as, so nothing is hidden by being put away. -->
      <div class="go build-row">
        <button class="btn" id="more" aria-expanded="false"
                data-w-title="more_tip" title="__W(more_tip)__">
          <span data-w="more">__W(more)__</span>
        </button>
        <button class="btn primary wide" id="build" data-w="build">__W(build)__</button>
      </div>
      <div id="build-note" role="status" aria-live="polite"></div>
      <div id="build-faults"></div>
    </section>

    <section class="card" id="runner">
      <h2><span data-w="r_head">__W(r_head)__</span>
        <button class="icon small" id="run-big" data-w-title="code_big"
                title="__W(code_big)__" aria-label="__W(code_big)__"
                aria-expanded="false">
          <svg viewBox="0 0 20 20"><path d="M8 2.5H2.5v5.5M12 2.5h5.5v5.5M8 17.5H2.5V12M12 17.5h5.5V12"/></svg>
        </button>
      </h2>
      <div class="switches one">
        <!-- How fast it goes is one choice, not a switch: straight
             through, a step every quarter second, a step each time you ask
             for one, or the program's own timing.  The third is what a
             class actually wants -- somewhere to stop and talk about the
             decision it is standing on -- and there was no way to ask
             for it: Step slowly advanced on a timer and you kept up
             with it or you did not.  The fourth is for a program that
             says how long its own steps take: "Wait 2 seconds", or "Wait
             random(1, 5) seconds", where a pace of our own would be
             talking over it. -->
        <select class="field" id="r-pace" data-w-title="r_pace"
                title="__W(r_pace)__" aria-label="__W(r_pace)__">
          <option value="fast" data-w="r_at_once">__W(r_at_once)__</option>
          <option value="slow" data-w="r_slowly" selected>__W(r_slowly)__</option>
          <option value="press" data-w="r_by_step">__W(r_by_step)__</option>
          <option value="timed" data-w="r_timed">__W(r_timed)__</option>
        </select>
      </div>
      <!-- One thing to press, the width of the panel, under the two
           dropdowns that say how it will go.  It matches Build the chart
           above it, which is the same kind of thing: the button the whole
           card is for. -->
      <div class="go-wide">
        <button class="btn primary wide" id="run" data-w="r_run">__W(r_run)__</button>
      </div>
      <!-- Only while it is standing there waiting to be asked for the next
           one.  It unfolds rather than appears, and breathes while it waits,
           because a run that has stopped on purpose and a run that has
           stopped by accident look exactly alike otherwise. -->
      <div id="next-row"><div class="next-in">
        <button class="btn primary wide" id="next" data-w="r_next">__W(r_next)__</button>
      </div></div>
      <!-- While a puzzle is open, Run says Check, and what the check found
           is said right under it -- where you are looking when you press
           it -- with the way on to the next one under that. -->
      <p class="hint" id="pz-mark"></p>
      <button class="btn primary wide" id="pz-next"
              data-w="pz_next" hidden>__W(pz_next)__</button>
      <p class="hint" id="run-note" aria-live="polite"></p>
      <!-- Test cases: what is typed in, and what it should print, checked
           in one press (34-tests.js).  A button the width of the card, like
           Run above it, and saying what it is for. -->
      <div class="tests-row">
        <button class="btn wide" id="tests-open" data-w-title="tests_tip" title="__W(tests_tip)__">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10.5l3.5 3.5L16 5.5"/><path d="M4 4.5h6M4 16h12"/></svg>
          <span data-w="tests_open">__W(tests_open)__</span>
        </button>
      </div>
      <!-- What the program is holding, while it is holding it.  The tape
           says what a program printed; it never said what it had in its
           hands, and what it has in its hands is the thing a class spends
           the lesson arguing about -- the total that comes out one too
           many, the counter that never moves, the name that is still
           empty because the Input went into a different box.
           Its heading is a switch, like Grid and Key, because it is not
           always wanted: when the point of the lesson is to work the values
           out by hand and then run it to see who was right, a table with
           the answers in it gives the game away.  Unticked, the table folds
           up under its heading here and is left out of the full screen. -->
      <div id="watch" hidden>
        <div class="watch-top">
          <label class="switch watch-switch" data-w-title="held_switch"
                 title="__W(held_switch)__">
            <span data-w="held_head">__W(held_head)__</span>
            <input type="checkbox" id="held-on" checked>
          </label>
          <span class="watch-where" id="watch-where"></span>
          <!-- Every change the run made, step by step, as the table a
               class is asked to fill in by hand (14-run.js). -->
          <button class="btn small trace-open" id="trace-open" data-w="trace_open"
                  data-w-title="trace_tip" title="__W(trace_tip)__"
                  hidden>__W(trace_open)__</button>
        </div>
        <div class="watch-body"><div class="watch-in">
          <div class="watch-rows" id="watch-rows"></div>
        </div></div>
      </div>
      <div id="tape" class="tape" role="log" aria-live="polite" data-w-aria="r_head" aria-label="__W(r_head)__"></div>
    </section>

    <!-- Getting the code out, which is a different errand from running it
         and now has a card of its own for it.  It used to be a dropdown
         inside Run it, where picking a language was both the choosing and
         the asking -- so there was no way to say "Java, in a file each"
         without first being shown the Java, and no room to say it in.
         Here: which language, whether it comes out as one file or as a
         file for each chart, and a button.  Directly under the card it
         came out of, because reading the program and running it are the
         two things you do with a chart once it is drawn. -->
    <!-- In the Code tab the program is code already, so there is nothing
         to write out: the same card translates it instead, into any of
         the other languages (32-code-side.js leaves its own out of the
         list).  Each name is said by the way of working it belongs to. -->
    <section class="card" id="coder">
      <h2><span class="not-lang" data-w="c_head">__W(c_head)__</span><span
        class="only-lang" data-w="tr_head">__W(tr_head)__</span></h2>
      <div class="switches">
        <!-- The list is filled in from the table in 18-code.js, so adding
             a language there adds it here too. -->
        <select class="field" id="see-code" data-w-title="r_lang_pick"
                title="__W(r_lang_pick)__" aria-label="__W(r_lang_pick)__"></select>
        <!-- One file or several.  A program of any size used to come out
             as one block of code however many charts it was drawn as,
             which is not how anybody would have written it and is not
             much use to read either.  A chart is already cut into charts
             -- main, and a drawing for each module -- so that is the cut:
             a file for each one, and the files say where they are reading
             what the program shares from. -->
        <select class="field" id="code-apart" data-w-title="c_files_tip"
                title="__W(c_files_tip)__" aria-label="__W(c_files_tip)__">
          <option value="" data-w="c_one">__W(c_one)__</option>
          <option value="apart" data-w="c_apart">__W(c_apart)__</option>
        </select>
      </div>
      <div class="go-wide">
        <button class="btn primary wide" id="code-write"><span class="not-lang"
          data-w="c_write">__W(c_write)__</span><span class="only-lang"
          data-w="tr_go">__W(tr_go)__</span></button>
      </div>
      <p class="hint" id="code-note"></p>
    </section>

    <section class="card fold shut" id="roles">
      <h2 data-w="shapes_for">__W(shapes_for)__</h2>
      <!-- The heading alone names six kinds of step and offers thirty
           shapes, and says nothing about what picking one does: whether
           it changes what the chart means, or only what it looks like.
           The line that answers that was written in all four languages
           and then never put on the page. -->
      <p class="hint" data-w="shapes_for_hint">__W(shapes_for_hint)__</p>
      <div id="role-rows"></div>
    </section>
